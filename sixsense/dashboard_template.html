function chunk(list, n) { const out = []; for (let i = 0; i < list.length; i += n) out.push(list.slice(i, i + n)); return out; }

// Returns { pulled: [...accounts], needCredits: [...accounts], noMatch: [...accounts] }
async function ziRefresh(list, allowCredits) {
  const result = { pulled: [], needCredits: [], noMatch: [] };
  // 1. find ZoomInfo ids by website for accounts that have none (free)
  const needId = list.filter(a => !(a.zi && a.zi.company_id) && a.website);
  const groups = [];
  let cur = [];
  for (const a of needId) {
    const w = 'https://www.' + domainOf(a.website);
    if ((cur.concat(w).join(',')).length > 480) { groups.push(cur); cur = []; }
    cur.push(w);
  }
  if (cur.length) groups.push(cur);
  for (const g of groups) {
    const p = await ziCall(ziState.tools.search, { companyWebsite: g.join(','), underManagement: true, pageSize: 50 });
    for (const rec of (p.data || [])) {
      const at = rec.attributes || {};
      const a = needId.find(x => domainOf(x.website) === domainOf(at.website || ''));
      if (a && !(a.zi && a.zi.company_id)) {
        a.zi = { ...(a.zi || {}), company_id: String(rec.id), name: at.name || a.company,
          location: [at.city, at.state, at.country && at.country !== 'United States' ? at.country : ''].filter(Boolean).join(', '),
          employees: at.employeeCount ? String(at.employeeCount) : '', intent: (a.zi && a.zi.intent) || [] };
      }
    }
  }
  needId.filter(a => !(a.zi && a.zi.company_id)).forEach(a => { a.zi_checked_on = TODAY; result.noMatch.push(a); });
  // 2. check management status (free)
  const withId = list.filter(a => a.zi && a.zi.company_id);
  const managed = new Set();
  for (const g of chunk(withId, 50)) {
    const p = await ziCall(ziState.tools.search, { companyIdList: g.map(a => Number(a.zi.company_id)), underManagement: true, pageSize: 50 });
    for (const rec of (p.data || [])) if (rec.attributes && rec.attributes.managementStatus && rec.attributes.managementStatus.underManagement) managed.add(String(rec.id));
  }
  const toPull = withId.filter(a => allowCredits || managed.has(a.zi.company_id));
  withId.filter(a => !toPull.includes(a)).forEach(a => { a.zi.checked_on = TODAY; result.needCredits.push(a); });
  // 3. pull intent, 10 companies per call
  for (const g of chunk(toPull, 10)) {
    const p = await ziCall(ziState.tools.enrich, { zoominfoCompanyIds: g.map(a => Number(a.zi.company_id)), signalTypes: ['INTENT', 'SCOOP', 'NEWS'] });
    for (const r of (p.results || [])) {
      const id = String(r.company && r.company.zoominfoCompanyId);
      const a = g.find(x => x.zi.company_id === id);
      if (!a || r.status === 'error') continue;
      a.zi.intent = (r.signals || []).filter(x => !x.signalType || /intent/i.test(x.signalType)).map(x => ({
        topic: (x.details || {}).topic, category: (x.details || {}).category, score: (x.details || {}).signalScore,
        audience: (x.details || {}).audienceStrength, date: String(x.date || '').slice(0, 10) })).filter(t => t.topic);
      a.zi.scoops = (r.signals || []).filter(x => /scoop/i.test(x.signalType || '')).map(x => ({
        date: String(x.date || '').slice(0, 10), summary: x.summary || '', link: (x.details || {}).link || '',
        types: ((x.details || {}).types || []).map(t => t.type).filter(Boolean) })).filter(x => x.summary);
      a.zi.news = (r.signals || []).filter(x => /news/i.test(x.signalType || '')).map(x => ({
        date: String(x.date || '').slice(0, 10), title: (x.details || {}).title || '', summary: String(x.summary || '').slice(0, 280),
        url: (x.details || {}).url || '', source: (x.details || {}).domain || '' })).filter(n => n.title);
      a.zi.news_on = TODAY;
      a.zi.pulled_on = TODAY;
      delete a.zi.skipped;
      result.pulled.push(a);
    }
  }
  // 4. new leaders: execs, HR, finance and payroll who started in the last 6 months (search is free, names and titles only)
  if (ziState.tools.contacts && result.pulled.length) {
    const titles = ['CEO', 'Chief Executive Officer', 'President', 'CFO', 'Chief Financial Officer', 'COO', 'Chief Operating Officer', 'Controller',
      'VP Finance', 'Director of Finance', 'Chief People Officer', 'CHRO', 'VP Human Resources', 'HR Director', 'Director of Human Resources',
      'Human Resources Manager', 'HR Manager', 'Payroll Manager', 'Payroll Director', 'Benefits Manager', 'Talent Acquisition'];
    const leaders = new Map(result.pulled.map(a => [a.zi.company_id, new Map()]));
    for (const [days, since] of [[180, addDays(TODAY, -180)], [90, addDays(TODAY, -90)]]) {
      for (const g of chunk(result.pulled, 50)) {
        for (let page = 1; page <= 3; page++) {
          const p = await ziCall(ziState.tools.contacts, { companyIdList: g.map(a => Number(a.zi.company_id)), jobTitleList: titles,
            positionStartDateMin: since, pageSize: 100, page });
          for (const rec of (p.data || [])) {
            const at = rec.attributes || {};
            const m = leaders.get(String((at.company || {}).id));
            if (m) m.set(String(rec.id), { name: [at.firstName, at.lastName].filter(Boolean).join(' '), title: at.jobTitle || '', person_id: String(rec.id), window_days: days, accuracy: at.contactAccuracyScore });
          }
          const total = ((p.meta || {}).totalResults) || 0;
          if (page * 100 >= total) break;
        }
      }
    }
    for (const a of result.pulled) { a.zi.new_leaders = [...leaders.get(a.zi.company_id).values()]; a.zi.triggers_on = TODAY; }
    // likeliest buyers (any start date)
    const buyerTitles = ['Chief People Officer', 'CHRO', 'VP Human Resources', 'Vice President Human Resources', 'HR Director', 'Director of Human Resources',
      'Head of Human Resources', 'Human Resources Manager', 'HR Manager', 'People Operations', 'Payroll Manager', 'Payroll Director', 'Payroll Supervisor',
      'CFO', 'Chief Financial Officer', 'Controller', 'VP Finance', 'Director of Finance', 'CEO', 'President', 'COO', 'Chief Operating Officer'];
    const people = new Map(result.pulled.map(a => [a.zi.company_id, new Map()]));
    for (const g of chunk(result.pulled, 50)) {
      for (let page = 1; page <= 5; page++) {
        const p = await ziCall(ziState.tools.contacts, { companyIdList: g.map(a => Number(a.zi.company_id)), jobTitleList: buyerTitles,
          pageSize: 100, page, sort: '-contactAccuracyScore' });
        for (const rec of (p.data || [])) {
          const at = rec.attributes || {};
          const m = people.get(String((at.company || {}).id));
          if (m) m.set(String(rec.id), { name: [at.firstName, at.lastName].filter(Boolean).join(' '), title: at.jobTitle || '', person_id: String(rec.id), accuracy: at.contactAccuracyScore });
        }
        if (page * 100 >= (((p.meta || {}).totalResults) || 0)) break;
      }
    }
    for (const a of result.pulled) { a.zi.people = [...people.get(a.zi.company_id).values()]; a.zi.people_on = TODAY; }
  }
  // 5. company snapshot (free: these companies are under management) and payroll vendor from tech stack (free search)
  if (result.pulled.length) {
    if (ziState.tools.firmo) {
      for (const g of chunk(result.pulled, 10)) {
        const p = await ziCall(ziState.tools.firmo, { companies: g.map(a => ({ companyId: String(a.zi.company_id) })),
          requiredFields: ['name', 'primaryIndustry', 'employeeCount', 'revenueRange', 'city', 'state', 'foundedYear', 'type', 'description', 'locationCount'] });
        for (const rec of Object.values(p || {})) {
          const dd = rec && rec.data; if (!dd) continue;
          const a = g.find(x => x.zi.company_id === String(dd.id)); if (!a) continue;
          const ind = Array.isArray(dd.primaryIndustry) ? dd.primaryIndustry : [dd.industry];
          a.zi.firmo = { industry: ind[0] || '', sub_industry: ind[1] || '', employees: dd.employeeCount || null,
            revenue_range: String(dd.revenueRange || '').replace(/\$(\d+) mil\. - \$(\d+) mil\./, '$$$1M–$$$2M'), hq: [dd.city, dd.state].filter(Boolean).join(', '),
            founded: dd.foundedYear || '', type: dd.type ? dd.type.charAt(0) + dd.type.slice(1).toLowerCase() : '', locations: dd.locationCount || null,
            about: String(dd.description || '').split(/(?<=\.)\s/)[0].slice(0, 220), on: TODAY };
        }
      }
    }
    const ids = result.pulled.map(a => Number(a.zi.company_id));
    const found = new Map(result.pulled.map(a => [a.zi.company_id, []]));
    for (const [vendor, tags] of Object.entries(PAYROLL_TECH)) {
      for (const g of chunk(ids, 50)) {
        const p = await ziCall(ziState.tools.search, { companyIdList: g, techAttributeTagIdList: tags, pageSize: 50 });
        for (const rec of (p.data || [])) if (found.has(String(rec.id))) found.get(String(rec.id)).push(vendor);
      }
    }
    for (const a of result.pulled) a.zi.payroll_tech = { ...(a.zi.payroll_tech || {}), vendors: found.get(a.zi.company_id).sort(), on: TODAY };
  }
  return result;
}

// Coverage: an account is due for ZoomInfo when it hasn't been pulled in ZI_STALE_DAYS days.
// Accounts ZoomInfo couldn't match by website are retried after ZI_NOMATCH_DAYS.
const ZI_STALE_DAYS = 7;
const ZI_NOMATCH_DAYS = 30;
const ZI_MAX_PER_IMPORT = 40;     // stale catch-up on each email import, highest score first
const ZI_BATCH = 20;              // accounts per step of "ZoomInfo: all"
function ziDue(a) {
  if (a.zi && a.zi.company_id) {
    const last = maxStr([a.zi.pulled_on, a.zi.checked_on].filter(isISO));
    return !(last && daysBetween(TODAY, last) < ZI_STALE_DAYS);
  }
  if (!a.website) return false;
  return !(isISO(a.zi_checked_on) && daysBetween(TODAY, a.zi_checked_on) < ZI_NOMATCH_DAYS);
}
function ziSkipText() { return 'Not pulled: not under management in ZoomInfo, so it would cost credits.'; }

// ↻ ZoomInfo: all — every due account, any tier, in small steps. Saves once at the end (saving reloads the page).
async function ziRunAll() {
  if (ziState.busy || !ziCanRefresh()) return;
  const list = accounts.filter(ziDue).sort((x, y) => y.priority.score - x.priority.score);
  if (!list.length) { setSaveState('ok', `ZoomInfo: every account was checked in the last ${ZI_STALE_DAYS} days`); return; }
  ziState.busy = true;
  const btns = ['btnZi', 'btnZiAll'].map(id => document.getElementById(id));
  btns.forEach(b => { b.disabled = true; });
  const tot = { pulled: 0, needCredits: 0, noMatch: 0 };
  let done = 0, stopped = '';
  try {
    for (const g of chunk(list, ZI_BATCH)) {
      setSaveState('', `ZoomInfo: ${done} of ${list.length} accounts checked… keep this page open`);
      try {
        const r = await ziRefresh(g, false);
        r.needCredits.forEach(a => { a.zi.skipped = a.zi.skipped || ziSkipText(); });
        tot.pulled += r.pulled.length; tot.needCredits += r.needCredits.length; tot.noMatch += r.noMatch.length;
      } catch (err) { stopped = ziErrorText(err); break; }
      done += g.length;
      await new Promise(res => setTimeout(res, 1500));   // stay well under ZoomInfo's rate limit
    }
  } finally {
    ziState.busy = false;
    btns.forEach(b => { b.disabled = false; });
  }
  const msg = `ZoomInfo: ${tot.pulled} updated · ${tot.needCredits} skipped (would cost credits) · ${tot.noMatch} not found` +
    (stopped ? ` · stopped after ${done} of ${list.length}: ${stopped.replace(/\s*Nothing was changed\.?/i, '').replace(/\.$/, '')}. What was pulled is kept; click ↻ ZoomInfo: all again to continue.` : '');
  if (tot.pulled || tot.needCredits || tot.noMatch) { persist(); setSaveState(stopped ? 'err' : '', msg + ' Sharing…'); }
  else setSaveState(stopped ? 'err' : 'ok', msg);
  render();
}
document.getElementById('btnZiAll').addEventListener('click', () => ziRunAll());

async function ziRun(list, { allowCredits = false, single = null } = {}) {
  if (ziState.busy || !ziCanRefresh()) return;
  ziState.busy = true;
  const btn = document.getElementById('btnZi');
  btn.disabled = true;
  if (single) { ziState.working.add(single.company); renderTable(); }
  setSaveState('', single ? `ZoomInfo: checking ${single.company}…` : `ZoomInfo: checking ${list.length} accounts…`);
  try {
    const r = await ziRefresh(list, allowCredits);
    if (single) {
      if (r.needCredits.includes(single)) ziState.confirm.add(single.company); else ziState.confirm.delete(single.company);
    } else {
      r.needCredits.forEach(a => { a.zi.skipped = a.zi.skipped || 'Not pulled: not under management in ZoomInfo, so it would cost credits.'; });
    }
    const parts = [`${r.pulled.length} updated`];
    if (r.needCredits.length) parts.push(single ? 'needs credits' : `${r.needCredits.length} skipped (would cost credits)`);
    if (r.noMatch.length) parts.push(`${r.noMatch.length} not found in ZoomInfo`);
    if (r.pulled.length || (!single && r.needCredits.length)) {
      persist();                                       // shares the update (the page reloads once saved)
      setSaveState('', 'ZoomInfo: ' + parts.join(' · ') + '. Sharing…');
    } else {
      setSaveState(r.needCredits.length ? '' : 'ok', 'ZoomInfo: ' + parts.join(' · '));
    }
  } catch (err) {
    setSaveState('err', ziErrorText(err));
  } finally {
    ziState.busy = false;
    btn.disabled = false;
    if (single) ziState.working.delete(single.company);
    render();
  }
}

// BenefitFlow (owner only): benefits renewal, broker, carrier, signals and contacts.
// Searches are free. Revealing a contact's email/phone costs BenefitFlow contact credits,
// so it always shows a free price check first and needs a second click.
// ═══════════════════════════════════════════════════════════════════════════
const BF_SERVER = 'BenefitFlow';
const BF_STALE_DAYS = 30;        // renewal and broker data come from yearly filings, so monthly is plenty
const BF_MAX_PER_IMPORT = 60;    // ~120 calls, well inside BenefitFlow's 500 calls a day
const bfState = { mcp: null, canReveal: false, busy: false, last: 0, working: new Set(), confirm: new Map(), acctWorking: new Set() };
function bfCanRefresh() { return share.mode === 'writer' && !!bfState.mcp; }
function bfCanReveal() { return bfCanRefresh() && bfState.canReveal; }
function bfButtonHtml(a) {
  if (!bfCanRefresh()) return '';
  if (bfState.acctWorking.has(a.company)) return `<button class="btn sm zi-btn" disabled>Checking BenefitFlow…</button>`;
  return `<button class="btn sm zi-btn" data-bf="${esc(a.company)}">↻ ${a.bf ? 'Refresh' : 'Pull'} BenefitFlow</button>`;
}
async function initBf() {
  if (share.mode !== 'writer') return;
  const mcp = await window.claude.use('mcp').catch(() => null);
  if (!mcp) return;
  try {
    const lt = await mcp.listTools(BF_SERVER);
    const srv = (lt.servers || []).find(x => x.server === BF_SERVER);
    const names = srv ? srv.tools.map(t => t.name) : [];
    if (!names.includes('search_employers') || !names.includes('search_contacts')) return;   // no BenefitFlow connector here
    bfState.canReveal = names.includes('get_contact');
  } catch (e) { return; }
  bfState.mcp = mcp;
  document.getElementById('btnBf').classList.remove('hidden');
  render();
}
// BenefitFlow allows 50 calls a minute per user: space calls out.
async function bfCall(tool, input) {
  const wait = bfState.last + 1300 - Date.now();
  if (wait > 0) await new Promise(r => setTimeout(r, wait));
  bfState.last = Date.now();
  const res = await bfState.mcp.callTool(BF_SERVER, tool,
    { ...input, context: 'Sales call-prioritization dashboard: benefits renewal, broker and buyer contacts for target accounts.' }, { cache: false });
  let p = res && res.payload;
  if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { /* text */ } }
  return p || {};
}
function bfErrorText(err) {
  const code = err && err.code;
  switch (code) {
    case 'needs_reauth': return 'BenefitFlow sign-in expired. Reconnect it in claude.ai Settings → Connectors.';
    case 'server_not_connected': return 'BenefitFlow is not connected. Add it in claude.ai Settings → Connectors.';
    case 'selection_required': return 'Choose which BenefitFlow connection this page should use, then try again.';
    case 'not_in_manifest': return 'BenefitFlow is turned off for this page. Allow it in the page\'s permissions, then try again.';
    case 'approval_required': return 'BenefitFlow needs your approval. Click the button again and choose Allow.';
    case 'blocked_by_policy': return 'Your organization blocks this BenefitFlow tool.';
    case 'server_unavailable': return 'BenefitFlow did not answer (it may be busy). Try again in a minute.';
    case 'tool_error': return 'BenefitFlow returned an error: ' + String(err.message || '').slice(0, 140);
    default: return 'BenefitFlow refresh failed' + (code ? ' (' + code + ')' : '') + '. Nothing was changed.';
  }
}
function bfISO(s) {
  const m = String(s || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  return isISO(String(s || '').slice(0, 10)) ? String(s).slice(0, 10) : null;
}
function bfPick(results, a) {
  const d = domainOf(a.website);
  const byDomain = results.find(r => d && domainOf(r.website || '') === d);
  if (byDomain) return byDomain;
  // Same name only counts when the websites don't disagree (e.g. "IGC" igc.org is not "IGC" igccorporation.com)
  const n = normName(a.company);
  return results.find(r => normName(r.name) === n && (!d || !r.website || domainOf(r.website) === d)) || null;
}
// Returns { pulled: [...], noMatch: [...] }. Two free searches per account.
async function bfRefresh(list, onProgress) {
  const result = { pulled: [], noMatch: [] };
  let i = 0;
  for (const a of list) {
    i++;
    if (onProgress) onProgress(i, list.length, a);
    const include = ['partners', 'signals'];
    let p;
    if (a.bf && a.bf.employer_id) p = await bfCall('search_employers', { employerMasterId: { include: [a.bf.employer_id] }, include });
    else if (a.website) p = await bfCall('search_employers', { employerNameSearch: domainOf(a.website), include });
    else p = await bfCall('search_employers', { employerNameSearch: a.company, include });
    let rows = p.results || [];
    let r = (a.bf && a.bf.employer_id && rows.find(x => x.employerId === a.bf.employer_id)) || bfPick(rows, a);
    if (!r && a.website && !(a.bf && a.bf.employer_id)) {   // website not on file there: try the company name
      rows = (await bfCall('search_employers', { employerNameSearch: a.company, include })).results || [];
      r = bfPick(rows, a);
    }
    const revealed = (a.bf && a.bf.revealed) || undefined;
    if (!r) { a.bf = { no_match: true, pulled_on: TODAY, ...(revealed ? { revealed } : {}) }; result.noMatch.push(a); continue; }
    a.bf = {
      employer_id: r.employerId, name: r.name || '', hq: r.headquarters || '', website: r.website || '',
      employees: r.totalEmployees || null, eligible: r.benefitEligibleEmployees || null, industry: r.industry || '',
      broker: r.broker || '', broker_id: r.brokerId || '', broker_years: r.brokerYearsOfService || null,
      carrier: r.carrier || '', funding: r.fundingType || '', renewal: bfISO(r.renewalDate), plan_types: r.planTypes || [],
      intent: r.compositeIntentScore || '', peo: r.peo || '',
      secondary_broker: (r.secondaryBenefitsBroker && r.secondaryBenefitsBroker.name) || '', ancillary: (r.ancillaryCarrier && r.ancillaryCarrier.name) || '',
      signals: (r.signals || []).map(x => ({ type: x.signalType, at: String(x.occurredAt || '').slice(0, 10), count: x.count || 1 })),
      pulled_on: TODAY,
    };
    // buyers at the company: names, titles and whether an email/phone exists (free; revealing costs credits)
    const c = await bfCall('search_contacts', { contactType: 'employer', companyMasterIds: [r.employerId], roles: { include: ['HR', 'Benefits', 'Finance', 'Executive'] } });
    a.bf.people = (c.results || []).map(x => ({ id: x.contactId, name: x.name, title: x.jobTitle || '', city: x.city || '', state: x.state || '', hasEmail: !!x.hasEmail, hasPhone: !!x.hasPhone }));
    a.bf.people_on = TODAY;
    if (revealed) a.bf.revealed = revealed;
    result.pulled.push(a);
  }
  return result;
}
async function bfRun(list, single = null) {
  if (bfState.busy || !bfCanRefresh()) return;
  bfState.busy = true;
  const btn = document.getElementById('btnBf');
  btn.disabled = true;
  if (single) { bfState.acctWorking.add(single.company); renderTable(); }

    const parts = [`${r.pulled.length} updated`];
    if (r.noMatch.length) parts.push(`${r.noMatch.length} not found`);
    persist();
    setSaveState('', 'BenefitFlow: ' + parts.join(' · ') + '. Sharing…');

  }
}
// Pull an email and a phone number out of a reveal answer, whatever its exact shape.
function bfContactInfo(obj) {
  const emails = [], phones = [];
  const walk = (v, key) => {
    if (v == null) return;
    if (typeof v === 'string' || typeof v === 'number') {
      const t = String(v).trim();
      if (/email/i.test(key) && /@/.test(t)) emails.push(t);
      else if (/phone|mobile|direct/i.test(key) && /\d{7,}/.test(t.replace(/\D/g, ''))) phones.push(t);
      return;
    }
    if (Array.isArray(v)) { v.forEach(x => walk(x, key)); return; }
    if (typeof v === 'object') for (const [k, x] of Object.entries(v)) walk(x, /^(value|address|number)$/i.test(k) ? key : k);
  };
  walk(obj, '');
  return { email: emails[0] || '', phone: phones[0] || '' };
}
async function bfReveal(a, id) {
  if (!bfCanReveal() || bfState.working.has(id)) return;
  bfState.working.add(id); renderTable();
  try {
    if (!bfState.confirm.has(id)) {
      const q = await bfCall('get_contact', { contactId: id });          // free price check
      const cost = Number(q.costInCredits || 0);
      const already = bfContactInfo(q);
      if (already.email || already.phone) { a.bf.revealed = { ...(a.bf.revealed || {}), [id]: { ...already, on: TODAY } }; persist(); return; }
      if (cost > 0) { bfState.confirm.set(id, cost); setSaveState('', `BenefitFlow: revealing this contact costs ${cost} credit. Click again to confirm.`); return; }
    }
    const r = await bfCall('get_contact', { contactId: id, confirm: true });
    bfState.confirm.delete(id);
    const info = bfContactInfo(r);
    a.bf.revealed = { ...(a.bf.revealed || {}), [id]: { ...info, on: TODAY } };
    persist();
    setSaveState('', info.email || info.phone ? 'BenefitFlow: contact revealed. Sharing…' : 'BenefitFlow: revealed, but no email or phone came back. Sharing…');
  } catch (err) {
    setSaveState('err', bfErrorText(err));
  } finally {
    bfState.working.delete(id);
    render();
  }
}

  bfRun(list);
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-bf]');
  if (b) { e.stopPropagation(); const a = byName(b.dataset.bf); if (a) bfRun([a], a); return; }
  const rv = e.target.closest('[data-bfrev]');
  if (rv) { e.stopPropagation(); const a = byName(rv.dataset.bfco); if (a && a.bf) bfReveal(a, rv.dataset.bfrev); }
});

// Preview build: a banner, and a switch to see the page the way the SDR does (read-only)
function renderPreviewBanner() {
  const b = document.getElementById('previewBanner');
  b.classList.remove('hidden');
  const sdr = share.mode === 'reader';
  b.innerHTML = `<b>Preview of the new layout</b> with a copy of your data. Nothing you do here changes your live dashboard. ` +
    `<button class="btn sm" data-asreader>${sdr ? 'Back to owner view' : 'See it as your SDR'}</button>`;
}
document.addEventListener('click', e => {
  if (!PREVIEW || !e.target.closest('[data-asreader]')) return;
  if (share.mode === 'reader') {
    share.mode = null;
    document.getElementById('shareBadge').classList.add('hidden');
    document.getElementById('ownerMenu').classList.remove('hidden');
    for (const id of ['btnImport', 'btnSave']) document.getElementById(id).classList.remove('hidden');
    setSaveState('', 'Owner view');
    render();
  } else setShareMode('reader');
  renderPreviewBanner();
});

// ═══════════════════════════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════════════════════════
(function init() {
  loadPrefs();
  restoreSessionUi();
  if (EMBEDDED_DATA) ingest(EMBEDDED_DATA, 'snapshot');
  // Inside claude.ai the published page is the shared record, so this browser's copy is not merged in.
  const inClaude = !!(window.claude && typeof window.claude.use === 'function');
  let stored = null;
  try { stored = inClaude ? null : JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { stored = null; }
  if (stored && typeof stored === 'object' && Object.keys(stored).length) {
    ingest(stored, 'snapshot');
    setSaveState('ok', 'Merged with this browser\'s saved data');
  }
  if (!accounts.length) document.getElementById('importPanel').classList.remove('hidden');
  render();
  if (inClaude && !PREVIEW) initShare();
  if (PREVIEW) renderPreviewBanner();
})();
</script>
