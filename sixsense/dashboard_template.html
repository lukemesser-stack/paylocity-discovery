<!--6S-START--><title>Target Now</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  /* Layout: command header, filter cards, today's call cards, then the ranked table. Single dark look on purpose. */
  :root {
    /* Look inspired by 6sense: deep forest green + mint, teal figures, warm cream ground,
       white cards, pastel Hot/Warm/Cold chips; geometric sans for UI, serif for descriptive text. */
    color-scheme: light;
    --bg: #f2f0ea;
    --surface: #ffffff;
    --surface-2: #f8f6f1;
    --surface-3: #f5f2eb;
    --border: #e8e3d8;
    --border-bright: #d9d2c3;
    --text: #13221b;
    --text-2: #4b5a52;
    --text-dim: #868e87;
    --accent: #0e8577;
    --accent-dim: #dcf3ef;
    --accent-2: #2fd66c;
    --brand: #00472a;
    --brand-2: #0b5a38;
    --on-brand: #ffffff;
    --on-brand-2: #b6d6c4;
    --a: #c2410c; --a-dim: #fce3d8; --a-line: #f0b49c;
    --b: #8a6100; --b-dim: #fcf0c6; --b-line: #ecd27f;
    --c: #0b7a80; --c-dim: #d6f4f2; --c-line: #8fdcd8;
    --d: #6b6f68; --d-dim: #eeebe3; --d-line: #d9d2c3;
    --stage: #1f5fa8; --stage-dim: #e0edfb;
    --green: #127a52; --green-dim: #dcf5e6;
    --yellow: #8a6100; --yellow-dim: #fcf0c6;
    --comp: #c2410c; --comp-dim: #fce3d8;
    --linkedin: #0a66c2;
    --on-accent: #ffffff;
    --spark: #2fd66c;
    --track: #ebe7de;
    --shadow: 0 1px 2px rgba(19,34,27,0.05), 0 8px 24px rgba(19,34,27,0.06);
    --radius: 14px; --radius-sm: 8px;
    --font: 'Figtree', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    --serif: var(--font);   /* one font everywhere */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }   /* stop iPhone from enlarging some text blocks */
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; min-height: 100vh; }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--text); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .hidden { display: none !important; }

  /* Header */
  .header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding-block: 18px 14px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); 
    background: var(--brand); color: var(--on-brand); position: relative; }
  .header .sub, .header .title-sub { color: var(--on-brand-2); }
  .header .sub b { color: var(--on-brand); }
  .header .btn { background: transparent; border-color: rgba(255,255,255,0.32); color: var(--on-brand); }
  .header .btn:hover { background: rgba(255,255,255,0.10); border-color: var(--on-brand); }
  .header .btn.primary { background: var(--spark); border-color: var(--spark); color: var(--brand); }
  .header .btn.primary:hover { filter: brightness(1.05); }
  .header .save-state { color: var(--on-brand-2); }
  .header .save-state.ok { color: var(--spark); }
  .header .save-state.err { color: #ffb4a0; }
  .header .share-badge { background: rgba(255,255,255,0.12); color: var(--on-brand); }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo-mark { width: 14px; height: 14px; margin: 0 6px; border-radius: 50%; flex: none; background: var(--spark);
    box-shadow: 0 0 0 6px rgba(47,214,108,0.22), 0 0 0 12px rgba(47,214,108,0.08); }
  .title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .title-sub { font-family: var(--serif); font-weight: 400; font-size: 14px; letter-spacing: 0; }
  .sub { font-size: 12px; color: var(--text-2); font-family: var(--serif); }
  .sub b { color: var(--text); font-weight: 600; }
  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { background: var(--surface-2); border: 1px solid var(--border-bright); border-radius: var(--radius-sm);
    padding: 7px 12px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); background: var(--surface-3); }
  .btn { border-radius: 999px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.sm { padding: 4px 8px; font-size: 11px; }
  .save-state { font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .save-state::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .save-state.ok { color: var(--green); }
  .save-state.err { color: var(--a); }

  .wrap { padding-block: 20px 40px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
  h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.2px; color: var(--text);
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--text-dim); font-size: 12px; }

  /* Stat cards = filters */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { text-align: left; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; transition: border-color .15s, background .15s; }
  .stat:hover { border-color: var(--border-bright); background: var(--surface-2); }
  .stat.on { border-color: var(--accent); background: var(--accent-dim); box-shadow: 0 0 0 2px var(--accent-dim); }
  .stat-label { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .stat-label i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .stat-value { font-size: 34px; font-weight: 800; line-height: 1.1; color: var(--accent); letter-spacing: -0.5px; }
  .stat-unit { font-size: 13px; color: var(--text-2); font-family: var(--serif); line-height: 1.35; }

  /* Focus cards */
  .focus-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .fcard { background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--border); border-left: 3px solid var(--a); border-radius: var(--radius);
    padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .fcard.tier-B { border-left-color: var(--b-line); }
  .fcard { border-left-color: var(--a-line); }
  .fcard-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .fcard-name { font-weight: 700; font-size: 15px; line-height: 1.3; cursor: pointer; }
  .fcard-name:hover { color: var(--accent); }
  .fcard-meta { font-size: 11px; color: var(--text-2); }
  .fcard .reasons { font-size: 13px; font-family: var(--serif); color: var(--text-2); display: flex; flex-direction: column; gap: 2px; }
  .fcard-actions { display: flex; gap: 6px; margin-top: auto; }
  .empty { color: var(--text-dim); font-size: 13px; padding: 14px 0; }

  /* Score */
  .score { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; height: 26px; padding: 0 6px;
    border-radius: 6px; font-weight: 800; font-size: 14px; }
  .score.A { background: var(--a-dim); color: var(--a); box-shadow: inset 0 0 0 1px var(--a-line); }
  .score.B { background: var(--b-dim); color: var(--b); box-shadow: inset 0 0 0 1px var(--b-line); }
  .score.C { background: var(--c-dim); color: var(--c); box-shadow: inset 0 0 0 1px var(--c-line); }
  .score.D { background: var(--d-dim); color: var(--d); box-shadow: inset 0 0 0 1px var(--d-line); }
  .tier-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; margin-top: 3px; white-space: nowrap; }
  .tier-label.A { color: var(--a); } .tier-label.B { color: var(--b); } .tier-label.C { color: var(--c); } .tier-label.D { color: var(--d); }

  /* Import panel */
  .panel { background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .drop { border: 2px dashed var(--border-bright); border-radius: var(--radius); padding: 26px; text-align: center; cursor: pointer; transition: all .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-dim); }
  .drop-title { font-weight: 600; }
  .drop-hint { font-size: 12px; color: var(--text-2); margin-top: 4px; }
  .log { margin-top: 12px; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; max-height: 220px; overflow: auto;
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; }
  .log:empty { display: none; }
  .log .ok { color: var(--green); } .log .warn { color: var(--yellow); } .log .err { color: var(--a); } .log .info { color: var(--text-2); }
  .panel-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .panel-actions .spacer { flex: 1; }

  /* Toolbar */
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .search { flex: 1 1 220px; min-width: 180px; background: var(--surface); border: 1px solid var(--border-bright); border-radius: var(--radius-sm); padding: 7px 10px; }
  .search::placeholder { color: var(--text-dim); }
  select { background: var(--surface); border: 1px solid var(--border-bright); border-radius: var(--radius-sm); padding: 7px 8px; font-size: 12px; }
  .chip { background: var(--surface); border: 1px solid var(--border-bright); border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; color: var(--text-2); }
  .chip:hover { color: var(--text); }
  .chip.on { background: var(--accent-dim); border-color: var(--accent); color: var(--text); }
  .count { font-size: 12px; color: var(--text-2); margin-left: auto; }

  /* Table */
  .table-wrap { background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead { background: var(--surface-3); }
  th { padding: 10px 12px; text-align: left; font-weight: 600; color: var(--text-2); font-size: 11px; letter-spacing: .5px;
    text-transform: uppercase; white-space: nowrap; border-bottom: 1px solid var(--border-bright); }
  th[data-sort] { cursor: pointer; user-select: none; }
  th[data-sort]:hover { color: var(--text); }
  th.sorted { color: var(--accent); }
  th.sorted::after { content: ' ▼'; font-size: 9px; }
  th.sorted.asc::after { content: ' ▲'; }
  tbody tr.row { border-top: 1px solid var(--border); cursor: pointer; }
  tbody tr.row:hover { background: var(--surface-2); }
  tbody tr.row.open { background: var(--surface-2); }
  tbody tr.row.worked { opacity: .55; }
  td { padding: 10px 12px; vertical-align: top; }
  .co { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .co .caret { color: var(--text-dim); font-size: 10px; transition: transform .15s; display: inline-block; }
  tr.open .co .caret { transform: rotate(90deg); }
  .co-sub { font-size: 11px; color: var(--text-dim); margin-left: 16px; }
  .co-sub a { color: var(--text-2); text-decoration: none; }
  .co-sub a:hover { color: var(--accent); text-decoration: underline; }
  .flag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
  .flag.new { background: var(--green-dim); color: var(--green); }
  .flag.dup { background: var(--yellow-dim); color: var(--yellow); }
  .flag.worked { background: var(--d-dim); color: var(--text-2); }
  .flag.qa { background: var(--a-dim); color: var(--a); letter-spacing: .3px; }
  .flag.ok { background: var(--green-dim); color: var(--green); }
  .flag.warn { background: var(--yellow-dim); color: var(--yellow); }
  .flag.trig { background: var(--b-dim); color: var(--b); }
  .trig-row { display: grid; grid-template-columns: 72px 1fr; gap: 10px; font-size: 12px; margin-bottom: 3px; }
  .trig-row .d { color: var(--text-dim); }
  .trig-row .k { font-weight: 700; color: var(--b); }
  .trig-row a { color: var(--accent); text-decoration: none; }
  a.li { color: var(--text); font-weight: 600; text-decoration: underline; text-decoration-color: var(--linkedin); text-underline-offset: 2px; white-space: nowrap; }
  a.li:hover { color: var(--accent); }
  .flag.hist { background: var(--accent-dim); color: var(--accent); }
  .hist-btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .hist-text { font-size: 12px; white-space: pre-wrap; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px; }
  .flag.vendor { background: var(--a-dim); color: var(--a); box-shadow: inset 0 0 0 1px var(--a-line); }
  .flag.client { background: var(--yellow-dim); color: var(--yellow); }
  .co-firmo { font-size: 11px; color: var(--text-2); margin: 1px 0 0 16px; font-family: var(--serif); }
  .snap { display: grid; grid-template-columns: 96px 1fr; gap: 2px 10px; font-size: 12px; }
  .snap dt { color: var(--text-dim); }
  .snap dd { margin: 0; color: var(--text); }
  .snap dd a, .careers a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .snap dd a:hover, .careers a:hover { text-decoration: underline; }
  .about { font-family: var(--serif); font-size: 13px; color: var(--text-2); margin-top: 6px; line-height: 1.45; }
  .news-row { display: grid; grid-template-columns: 72px 1fr; gap: 10px; font-size: 12px; margin-bottom: 5px; }
  .news-row .d { color: var(--text-dim); }
  .news-row a { color: var(--text); font-weight: 600; text-decoration: none; }
  .news-row a:hover { color: var(--accent); text-decoration: underline; }
  .news-row .src { color: var(--text-dim); font-size: 11px; }
  .acc { display: inline-block; font-size: 10px; font-weight: 700; color: var(--text-2); border: 1px solid var(--border-bright); border-radius: 3px; padding: 0 4px; margin-left: 4px; vertical-align: 1px; font-variant-numeric: tabular-nums; }
  .acc.low { color: var(--yellow); border-color: var(--yellow-dim); }
  .person.low { opacity: .6; }
  .buyer-row { display: grid; grid-template-columns: 74px 1fr; gap: 8px; font-size: 12px; margin-bottom: 4px; align-items: baseline; }
  .buyer-row .g { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--text-dim); }
  .buyer-row .t { color: var(--text-2); }
  .co-buyer { font-size: 11px; color: var(--text-2); margin: 2px 0 0 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .li-badge { display: inline-block; font-size: 9px; font-weight: 800; line-height: 13px; background: var(--linkedin); color: var(--on-accent); border-radius: 3px; padding: 0 3px; margin-left: 4px; vertical-align: 1px; text-decoration: none; }
  .zi-row { display: grid; grid-template-columns: 72px 1fr auto; gap: 10px; font-size: 12px; align-items: baseline; }
  .zi-row .d { color: var(--text-dim); }
  .zi-row .s { font-weight: 700; font-variant-numeric: tabular-nums; }
  .zi-row.off { opacity: .45; }
  .zi-row .cat { color: var(--text-dim); font-size: 11px; }
  .zi-btn { margin-top: 6px; }
  .rev { font-size: 11px; margin-left: 6px; white-space: nowrap; }
  .rev a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .rev a:hover { text-decoration: underline; }
  .src-tag { font-size: 10px; color: var(--text-dim); margin-left: 4px; }
  .bf-more summary { cursor: pointer; font-size: 12px; color: var(--accent); margin-top: 4px; }
  .renew-soon { color: var(--a); font-weight: 700; }
  .welcome h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .welcome ol { margin: 8px 0 0 20px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .welcome .muted { margin-top: 8px; }
  .prompt-box { margin-top: 6px; width: 100%; min-height: 150px; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--bg); border: 1px solid var(--border-bright); border-radius: var(--radius-sm); padding: 8px; resize: vertical; }
  .zi-btn.confirm { border-color: var(--yellow); color: var(--yellow); }
  .btn:disabled { opacity: .5; cursor: wait; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge { border-radius: 999px; padding: 2px 9px; }
  .badge.stage { background: var(--stage-dim); color: var(--stage); }
  .badge.strong { background: var(--c-dim); color: var(--c); }
  .badge.moderate { background: var(--d-dim); color: var(--text-2); }
  .badge.weak { background: var(--a-dim); color: var(--a); }
  .sf { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .when { white-space: nowrap; }
  .ago { font-size: 11px; color: var(--text-dim); }
  .trend-up { color: var(--green); } .trend-down { color: var(--text-dim); }
  .spark { display: flex; gap: 1px; margin-top: 5px; height: 10px; align-items: flex-end; }
  .spark i { width: 3px; height: 4px; background: var(--track); border-radius: 1px; }
  .spark i.on { height: 10px; background: var(--spark); }
  .why { font-size: 13px; font-family: var(--serif); line-height: 1.45; color: var(--text-2); display: flex; flex-direction: column; gap: 1px; max-width: 340px; }
  .why .hot { color: var(--text); }
  .kw { display: inline-block; background: var(--surface-3); color: var(--text-2); box-shadow: inset 0 0 0 1px var(--border); padding: 1px 8px; border-radius: 999px; font-size: 11px; margin: 0 4px 3px 0; }
  .kw.comp { background: var(--comp-dim); color: var(--comp); font-weight: 600; }
  .action { font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: var(--radius-sm); display: inline-block; white-space: nowrap; }
  .action { border-radius: 999px; }
  .action.P1 { background: var(--a-dim); color: var(--a); box-shadow: inset 0 0 0 1px var(--a-line); }
  .action.P2 { background: var(--b-dim); color: var(--b); box-shadow: inset 0 0 0 1px var(--b-line); }
  .action.P3 { background: var(--green-dim); color: var(--green); }
  .action.P4 { background: var(--d-dim); color: var(--text-2); }
  .work-btn { background: transparent; border: 1px solid var(--border-bright); border-radius: var(--radius-sm); padding: 4px 8px; font-size: 11px; color: var(--text-2); white-space: nowrap; }
  .work-btn:hover { border-color: var(--green); color: var(--green); }
  .work-btn.done { border-color: var(--green); color: var(--green); background: var(--green-dim); }

  /* Detail */
  tr.detail > td { background: var(--surface-3); padding: 16px 20px 18px 36px; border-top: 1px solid var(--border); cursor: default; }
  .detail-grid { display: grid; grid-template-columns: 260px 1fr 1fr; gap: 24px; }
  .dlabel { font-size: 11px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: .5px; margin: 0 0 6px; }
  .dblock + .dblock, .dcol > .sec + .sec { margin-top: 14px; }
  .detail-grid > .dcol { min-width: 0; }
  .detail-flow { columns: 3 300px; column-gap: 32px; }
  .detail-flow > .sec { break-inside: avoid; display: block; margin-bottom: 18px; min-width: 0; }
  .detail-flow > .sec:has(.bf-more[open]) { break-inside: auto; }
  /* Score breakdown: one chip per factor, darker green = closer to full points */
  .bd-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .bd-chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; color: var(--text); background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-bright); }
  .bd-chip b { font-weight: 700; font-variant-numeric: tabular-nums; margin-left: 3px; }
  .bd-chip.l0 { color: var(--text-dim); }
  .bd-chip.l1 { background: #e3f6ea; box-shadow: inset 0 0 0 1px #c5ebd3; }
  .bd-chip.l2 { background: #a9e8c0; box-shadow: none; }
  .bd-chip.l3 { background: var(--spark); color: #06301c; box-shadow: none; }
  .bd-sum { font-size: 12px; color: var(--text-2); margin-top: 6px; line-height: 1.45; }
  .bd-sum b { color: var(--text); font-weight: 600; }
  .filters { display: contents; }
  .m-work { display: none; }
  .co-sub a.zi-open { color: var(--accent); font-weight: 600; }
  .rm-btn:hover { border-color: var(--a); color: var(--a); }
  .rm-btn.armed { border-color: var(--a); color: var(--on-accent); background: var(--a); }
  .removed-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--border); font-size: 13px; }
  .removed-row:first-child { border-top: 0; }
  #removedPanel summary { cursor: pointer; font-weight: 600; font-size: 13px; }

// ═══════════════════════════════════════════════════════════════════════════
// Scoring config: keep in sync with optimize_sixsense.py
// ═══════════════════════════════════════════════════════════════════════════
const COMPETITORS = ["adp", "workable", "rippling", "expensify", "pluralsight", "beti",
  "paycor", "paychex", "ultimate software", "ukg", "gusto", "bamboohr",
  "workday", "paycom", "isolved", "dayforce", "ceridian", "namely", "trinet"];
const HAND_RAISE_PAGES = ["/request-a-demo", "/contact", "/pricing", "/get-a-quote"];
const AD_LANDING_PAGES = ["/lp/", "/learn-more", "/demo/"];
const STAGE_POINTS = { purchase: 20, decision: 18, consideration: 13, awareness: 6, target: 3 };
const FIT_POINTS = { strong: 15, moderate: 8, weak: 0 };
const STAGE_RANK = { target: 1, awareness: 2, consideration: 3, decision: 4, purchase: 5 };
const FIT_RANK = { weak: 1, moderate: 2, strong: 3 };
const TIER_NAMES = { A: 'A - Call today', B: 'B - This week', C: 'C - Nurture', D: 'D - Monitor' };
const WORKED_HIDE_DAYS = 7;

const STORAGE_KEY = 'sixsense_dashboard_data';      // same key as v3, so saved progress carries over
const PREFS_KEY = 'sixsense_dashboard_prefs';

const params = new URLSearchParams(location.search);
const TODAY = /^\d{4}-\d{2}-\d{2}$/.test(params.get('today') || '') ? params.get('today') : localISO(new Date());

// ═══════════════════════════════════════════════════════════════════════════
// Date helpers
// ═══════════════════════════════════════════════════════════════════════════
function localISO(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function isISO(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
function utc(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }
function daysBetween(later, earlier) { return Math.round((utc(later) - utc(earlier)) / 86400000); }
function addDays(s, n) { return new Date(utc(s) + n * 86400000).toISOString().slice(0, 10); }
function fmtDate(d) {
  if (!isISO(d)) return d || '';
  const [y, m, dd] = d.split('-');
  return `${+m}/${+dd}/${y}`;
}
function agoText(n) {
  if (n == null) return '';
  if (n <= 0) return 'today';
  if (n === 1) return 'yesterday';
  return n + ' days ago';
}
function maxStr(list) { return list.filter(Boolean).reduce((a, b) => (b > a ? b : a), ''); }

// ═══════════════════════════════════════════════════════════════════════════
// Cleaning + scoring (mirrors optimize_sixsense.py)
// ═══════════════════════════════════════════════════════════════════════════
function uniqSorted(list) { return Array.from(new Set((list || []).filter(x => x != null && x !== ''))).sort(); }

function clean(src) {
  const a = { ...src };
  for (const f of ['keywords', 'competitor_keywords', 'decoded_urls', 'contacts', 'form_fills', 'dates', 'activity_dates', 'source_files', 'aliases', 'possible_duplicate_of', 'surge_topics'])
    a[f] = Array.isArray(a[f]) ? a[f].slice() : [];
  for (const f of ['signal_count', 'web_visits']) a[f] = parseInt(a[f], 10) || 0;
  for (const f of ['stage', 'fit', 'reach', 'website', 'company']) a[f] = String(a[f] || '').trim();
  // 6sense tags qualified accounts with a trailing "6QA". Keep it as a flag, not part of the name.
  const qa = a.company.match(/\s+6QA$/i);
  if (qa) {
    a.company = a.company.slice(0, qa.index).trim();
    const flagged = maxStr([...(a.activity_dates || []), ...(a.dates || [])].filter(isISO)) || null;
    if (flagged && flagged > (a.six_qa_on || '')) a.six_qa_on = flagged;
  }
  a.source_files = uniqSorted(a.source_files);
  a.decoded_urls = dedupeUrls(a.decoded_urls);
  a.dates = uniqSorted(a.dates.filter(isISO));
  a.activity_dates = uniqSorted(a.activity_dates.filter(isISO));
  const last = maxStr([...a.dates, ...a.activity_dates]) || null;
  if (!('email_date' in a)) a.email_date = null;
  if (!a.activity_date) a.activity_date = maxStr(a.activity_dates) || last;
  // always derived from the real dates, so stale stored values can't win a merge
  a._latest_date = maxStr([...a.dates, ...a.activity_dates, ...a.decoded_urls.map(u => u && u.date).filter(isISO)]) || null;
  const comp = new Set();
  [...a.keywords, ...a.competitor_keywords].forEach(k => { if (COMPETITORS.includes(String(k).trim().toLowerCase())) comp.add(k); });
  a.competitor_keywords = Array.from(comp).sort((x, y) => x.toLowerCase().localeCompare(y.toLowerCase()));
  a.keywords = uniqSorted(a.keywords);
  // The separate sales-history box is gone: its text moves into Notes (once), so nothing is lost.
  const hist = String(a.history_note || '').trim();
  if (hist) {
    const notes = String(a.notes || '');
    if (!notes.includes(hist)) a.notes = notes.trim() ? notes.trim() + '\n\nSales history: ' + hist : 'Sales history: ' + hist;
  }
  delete a.history_note;
  if (!a.bf || typeof a.bf !== 'object') delete a.bf;
  if (!a.zi || typeof a.zi !== 'object') delete a.zi;
  else a.zi = { ...a.zi, intent: Array.isArray(a.zi.intent) ? a.zi.intent : [] };
  a.surge_topics = dedupeObjects(a.surge_topics.filter(t => t && t.topic)).sort((x, y) => (y.date || '').localeCompare(x.date || ''));
  return a;
}

function dedupeUrls(urls) {
  const seen = new Set();
  return (urls || []).filter(u => {
    if (!u) return false;
    const k = (u.decoded || u.raw || '') + '|' + (u.date || '');
    if (seen.has(k)) return false;
    seen.add(k); return true;
  }).sort((x, y) => (y.date || '').localeCompare(x.date || ''));
}
function dedupeObjects(list) {
  const seen = new Set();
  return (list || []).filter(o => { const k = JSON.stringify(o); if (seen.has(k)) return false; seen.add(k); return true; });
}

function pagePath(url) { return String(url || '').replace(/^https?:\/\/[^/]+/, '') || '/'; }

function score(a) {
  const days = uniqSorted([...a.dates, ...a.activity_dates]).filter(d => d <= TODAY);
  const last = days.length ? days[days.length - 1] : null;
  const since = last ? daysBetween(TODAY, last) : 999;

  const recency = since <= 7 ? 25 : since <= 14 ? 20 : since <= 30 ? 14 : since <= 60 ? 8 : since <= 90 ? 3 : 0;
  const d30 = days.filter(d => daysBetween(TODAY, d) <= 30).length;
  const d60 = days.filter(d => { const n = daysBetween(TODAY, d); return n > 30 && n <= 60; }).length;
  const momentum = Math.min(12, d30 * 3) + (d30 > d60 && d30 >= 2 ? 3 : 0);
  const stage = STAGE_POINTS[a.stage.toLowerCase()] || 0;
  const fit = FIT_POINTS[a.fit.toLowerCase()] || 0;

  const within = (u, maxAge) => maxAge == null || (isISO(u.date) && daysBetween(TODAY, u.date) <= maxAge);
  const matching = (patterns, maxAge) => a.decoded_urls.filter(u =>
    patterns.some(p => pagePath(u.decoded || u.raw).includes(p)) && within(u, maxAge));
  const hand = matching(HAND_RAISE_PAGES), ad = matching(AD_LANDING_PAGES);
  let pages;
  if (matching(HAND_RAISE_PAGES, 30).length) pages = 15;
  else if (hand.length || matching(AD_LANDING_PAGES, 30).length) pages = 10;
  else if (ad.length) pages = 6;
  else pages = a.decoded_urls.length ? 3 : 0;
  const volume = Math.min(5, Math.floor(Math.log2(1 + a.signal_count)));
  const comp = a.competitor_keywords.length ? 5 : 0;
  const known = (a.contacts.length || a.form_fills.length) ? 2 : 0;

  const total = Math.min(100, recency + momentum + stage + fit + pages + volume + comp + known);
  let tier = total >= 65 ? 'A' : total >= 45 ? 'B' : total >= 28 ? 'C' : 'D';
  if (since > 60 && (tier === 'A' || tier === 'B')) tier = 'C';

  return {
    score: total,
    tier: TIER_NAMES[tier],
    action: recommendedAction(a, since, hand, ad, d30),
    last_activity: last,
    days_since_activity: last ? since : null,
    active_days_30d: d30,
    active_days_prev_30d: d60,
    trend: d30 > d60 ? 'heating up' : d30 < d60 ? 'cooling' : 'steady',
    hot_pages: uniqSorted([...hand, ...ad].map(u => pagePath(u.decoded || u.raw))),
    breakdown: { recency, momentum, stage, fit, pages, volume, competitor: comp, known_contact: known },
    scored_on: TODAY,
  };
}

function hasKw(a, ...words) {
  const blob = [...a.keywords, ...a.surge_topics.map(t => t.topic)].join(' | ').toLowerCase();
  return words.some(w => blob.includes(w));
}

function recommendedAction(a, since, hand, ad, d30) {
  const stage = a.stage.toLowerCase(), fit = a.fit.toLowerCase();
  const comp = a.competitor_keywords.join(', ');
  const fresh = since <= 30;
  const recent = us => us.some(u => isISO(u.date) && daysBetween(TODAY, u.date) <= 30);
  if (recent(hand)) return 'P1 Call today: visited demo/contact page';
  if (comp && stage === 'decision') return `P1 Close competitor deal (${comp})`;
  if (comp && stage === 'consideration' && since <= 14) return `P1 Displace ${comp}`;
  if ((stage === 'decision' || stage === 'purchase') && fit === 'strong' && fresh) return 'P1 Push to close';
  if (stage === 'consideration' && d30 >= 3 && since <= 7) return 'P1 Strike while hot';
  if (recent(ad) && (fit === 'strong' || fit === 'moderate')) return 'P2 Follow up on ad click (landing page)';
  if (stage === 'consideration' && a.signal_count >= 5 && fresh) return 'P2 Run discovery';
  if (hasKw(a, 'benefit', 'enrollment', 'aca', 'safe harbor', '401k', 'retirement') && fresh) return 'P2 Benefits pitch';
  if (hasKw(a, 'hris', 'hcm', 'migration', 'ultimate software', 'paycor', 'workday') && stage === 'consideration') return 'P2 Migration conversation';
  if (stage === 'awareness' && a.signal_count >= 10 && fresh) return 'P2 Warm up';
  if (hasKw(a, 'compensation', 'pay transparency', 'performance')) return 'P3 Comp & performance pitch';
  if (hasKw(a, 'talent', 'recruit', 'candidate', 'on boarding', 'onboarding')) return 'P3 Talent suite angle';
  if (hasKw(a, 'engagement', 'communication', 'retention', 'culture')) return 'P3 Engagement pitch';
  if (hasKw(a, 'airbase', 'corporate card', 'expense')) return 'P3 Spend management (Airbase) angle';
  if (fit === 'strong') return 'P3 Early nurture';
  return 'P4 Monitor';
}

// ── ZoomInfo intent (display only, not part of the score) ──
// Buying themes used to check whether ZoomInfo agrees with 6sense / Bombora / page visits.
const THEMES = {
  'Payroll / HCM': /\badp\b|automatic data processing|paychex|ukg|ultimate software|paycor|rippling|gusto|payroll|\bhris\b|\bhcm\b|workday|paycom|isolved|dayforce|ceridian|pay on demand/i,
  'Benefits': /benefit|\baca\b|affordable care|cobra|safe harbor|enrollment|401k|retirement|\bhra\b|health insurance/i,
  'Talent / recruiting': /talent|recruit|candidate|applicant|onboarding|on boarding|hiring/i,
  'Engagement': /engagement|communication|retention|culture|recognition/i,
  'Time & attendance': /attendance|time clock|timekeeping|\bhours\b|scheduling/i,
  'Asset management': /asset/i,
  'Spend / cards': /airbase|corporate card|credit card|expense|spend management/i,
};
function themesOf(text) { return Object.keys(THEMES).filter(k => THEMES[k].test(text)); }
function ziRelevant(t) { return themesOf(t.topic + ' ' + (t.category || '')).length > 0; }
function ziRecent(a, days = 60) {
  if (!a.zi) return [];
  return a.zi.intent.filter(t => isISO(t.date) && daysBetween(TODAY, t.date) <= days && ziRelevant(t))
    .sort((x, y) => y.score - x.score);
}
function ziConfirmed(a) {
  const zt = new Set(ziRecent(a).flatMap(t => themesOf(t.topic + ' ' + t.category)));

  ex.competitor_keywords = union(ex.competitor_keywords, inc.competitor_keywords);
  ex.dates = union(ex.dates, inc.dates);
  ex.activity_dates = union(ex.activity_dates, inc.activity_dates);
  ex.source_files = union(ex.source_files, inc.source_files);
  ex.decoded_urls = dedupeUrls([...ex.decoded_urls, ...inc.decoded_urls]);
  ex.contacts = dedupeObjects([...ex.contacts, ...inc.contacts]);
  ex.form_fills = dedupeObjects([...ex.form_fills, ...inc.form_fills]);
  ex.surge_topics = dedupeObjects([...ex.surge_topics, ...inc.surge_topics]).sort((x, y) => (y.date || '').localeCompare(x.date || ''));
  for (const f of ['email_date', 'activity_date', '_latest_date']) if ((inc[f] || '') > (ex[f] || '')) ex[f] = inc[f];
  ex.aliases = union(ex.aliases, [...(inc.aliases || []), inc.company]).filter(n => n !== ex.company);
  ex.possible_duplicate_of = union(ex.possible_duplicate_of, inc.possible_duplicate_of);
  if ((inc.six_qa_on || '') > (ex.six_qa_on || '')) ex.six_qa_on = inc.six_qa_on;
  if (inc.zi && (inc.zi.pulled_on || '') >= ((ex.zi && ex.zi.pulled_on) || '')) ex.zi = inc.zi;
  if (inc.bf) {   // newest pull wins; revealed contacts are kept from both
    const rv = { ...((ex.bf && ex.bf.revealed) || {}), ...(inc.bf.revealed || {}) };
    if ((inc.bf.pulled_on || '') >= ((ex.bf && ex.bf.pulled_on) || '')) ex.bf = { ...inc.bf };
    if (Object.keys(rv).length) ex.bf.revealed = rv;
  }
  if ((inc.worked_on || '') > (ex.worked_on || '')) ex.worked_on = inc.worked_on;
  if (!ex.notes && inc.notes) ex.notes = inc.notes;
  if (inc.past_process) { ex.past_process = true; if ((inc.past_process_on || '') > (ex.past_process_on || '')) ex.past_process_on = inc.past_process_on; }
  for (const f of ['removed_at', 'restored_at']) if ((inc[f] || '') > (ex[f] || '')) ex[f] = inc[f];
}

// mode 'snapshot': a cumulative JSON (re-loading is a no-op). mode 'increment': one newly parsed email.
function ingest(data, mode) {
  let added = 0, merged = 0;
  for (const raw of Object.values(data || {})) {
    if (!raw || typeof raw !== 'object' || !raw.company) continue;
    const inc = clean(raw);
    if (/^\d+ web visits?/i.test(inc.company) || /known contact/i.test(inc.company)) continue;
    const ex = findExisting(inc);
    if (ex) { mergeInto(ex, inc, mode); merged++; }
    else { accounts.push(inc); added++; }
  }
  partitionRemoved();
  rescore();
  return { added, merged };
}

function rescore() { allAccounts().forEach(a => { a.priority = score(a); }); }

function toObject() {
  const sorted = allAccounts().sort((x, y) => y.priority.score - x.priority.score || x.company.localeCompare(y.company));
  const out = {};
  sorted.forEach(a => { out[a.company] = a; });
  return out;
}

function persist() {
  if (share.mode === 'writer') { schedulePublish(1500); return; }
  if (share.mode === 'reader') return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toObject()));
    setSaveState('ok', 'Saved in this browser');
  } catch (e) {
    setSaveState('err', 'Browser save failed: use 💾 Save JSON');
  }
}
function setSaveState(cls, text) {
  const el = document.getElementById('saveState');
  el.className = 'save-state ' + cls;
  el.textContent = text;
}

function tierLetter(a) { return a.priority.tier.charAt(0); }

// Accounts ZoomInfo pulls cover (refresh-all button and email auto-refresh): Call today, This week, Heating up.
function ziTarget(a) { return 'AB'.includes(tierLetter(a)) || CARDS.heating.test(a); }
const CARDS = {

function matchesSearch(a, q) {
  if (!q) return true;
  const hay = [a.company, a.website, a.six_qa_on ? '6qa' : '', firmoLine(a), ...payrollVendors(a).map(v => v.name), ...newsItems(a).map(n => n.title), a.past_process ? 'past deal past sales process' : '', a.bf ? [a.bf.broker, a.bf.carrier, a.bf.peo, a.bf.secondary_broker, bfRenewingSoon(a) ? 'renewal renewing' : ''].join(' ') : '', ...buyers(a).map(p => p.name + ' ' + p.title), ...triggers(a).map(t => t.kind + ' ' + t.text), ...(a.zi ? a.zi.intent.map(t => t.topic) : []), ziConfirmed(a).length ? 'confirmed' : '', ...a.surge_topics.map(t => t.topic), ...(a.aliases || []), ...a.keywords, a.priority.action, a.stage, a.fit,
    ...a.decoded_urls.map(u => pagePath(u.decoded || u.raw)), ...(a.contacts || []).map(c => (c.name || '') + ' ' + (c.title || '')), a.notes || ''].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).every(t => hay.includes(t));
}

// Last-active window: days since 6sense last saw activity (no activity at all counts as quiet)
function activeMatch(a) {
  if (!ui.active) return true;
  const d = a.priority.days_since_activity;
  const known = typeof d === 'number' && d >= 0;
  if (ui.active === 'q90') return !known || d > 90;
  return known && d <= Number(ui.active);
}
function filtered(view = ui.view) {
  const v = ui.q ? VIEWS.all : (VIEWS[view] || VIEWS.all);
  return accounts.filter(a => v.test(a) &&

    (!ui.stage || a.stage === ui.stage) &&
    (!ui.fit || a.fit === ui.fit) &&
    activeMatch(a) &&
    [...ui.signals].every(k => CARDS[k].test(a)) &&
    (!ui.hideWorked || ui.q || !isWorkedRecently(a)) &&

function sortList(list) {
  const key = {
    score: a => a.priority.score,
    company: a => a.company.toLowerCase(),
    stage: a => (STAGE_RANK[a.stage.toLowerCase()] || 0) * 10 + (FIT_RANK[a.fit.toLowerCase()] || 0),
    last: a => a.priority.last_activity || '',
    action: a => a.priority.action,
  }[ui.sort] || (a => a.priority.score);
  return list.sort((x, y) => {
    const kx = key(x), ky = key(y);
    if (kx < ky) return -1 * ui.dir;
    if (kx > ky) return 1 * ui.dir;
    return y.priority.score - x.priority.score;
  });
}

// ── Account row: three calm lines (name + 2 badges + signals + score / strongest reasons / who + next step) ──

function badges(a) {

// The few strongest reasons to call right now, in plain words
function callReasons(a) {

  const vis = recentVisits(a, 60);
  const hand = vis.find(u => pageKind(u) === 'hand');
  if (hand) out.push(`Visited ${pagePath(hand.decoded || hand.raw).replace(/\/$/, '')} on ${shortDate(hand.date)}`);
  const rn = bfRenewal(a);
  if (rn && rn.days <= 120) out.push(`Benefits renew ${shortDate(rn.date)} (${rn.days} days)`);
  const tr = triggers(a).find(t => ['Acquisition', 'Leadership change', 'New leader', 'Broker change', 'Carrier switch'].includes(t.kind) && t.hot);
  if (tr) out.push(tr.kind === 'New leader' ? `New ${shortTitle(tr.title)}: ${tr.person}` : tr.kind);
  if (a.competitor_keywords.length) out.push('Researching ' + a.competitor_keywords.slice(0, 2).join(', '));
  const z = ziRecent(a)[0];
  if (z) out.push('ZoomInfo intent: ' + shortTopic(z.topic));
  if (!hand) { const ad = vis.find(u => pageKind(u) === 'ad'); if (ad) out.push(`Campaign page ${shortDate(ad.date)}`); }
  if (a.past_process) out.push('Past sales process');
  if (out.length < 3 && p.days_since_activity != null) out.push(`6sense activity ${agoText(p.days_since_activity)}${p.trend === 'heating up' && p.active_days_30d >= 2 ? ', heating up' : ''}`);

}
// Four sources at a glance: filled = that source has something current on this account

// Suggested opener: built from rules and the account's own signals (no AI). Edit it to your voice.
function openerText(a) {
  const buyer = buyers(a)[0];
  const first = buyer ? buyer.name.split(' ')[0] : '';
  const vis = recentVisits(a, 90);
  const bits = [];
  const paths = vis.filter(u => pageKind(u) === 'hand').map(u => pagePath(u.decoded || u.raw));
  const named = [['demo', /demo/], ['pricing', /pricing|quote/], ['contact', /contact/]].filter(([, re]) => paths.some(x => re.test(x))).map(([n]) => n);
  if (named.length) bits.push(`noticed your team looking at our ${named.join(' and ')} page${named.length > 1 ? 's' : ''}`);
  else if (vis.length) bits.push('saw your team checking out our HR and payroll resources');
  if (a.competitor_keywords.length) bits.push(`comparing options like ${a.competitor_keywords.slice(0, 2).join(' and ')}`);
  else { const z = ziRecent(a)[0]; if (z) bits.push(`looking into ${shortTopic(z.topic)}`); }
  const tr = triggers(a).find(t => t.kind === 'Acquisition' || t.kind === 'Leadership change');
  const rn = bfRenewal(a);
  const month = rn ? new Date(utc(rn.date)).toLocaleString('en-US', { month: 'long', timeZone: 'UTC' }) : '';
  const pv = payrollVendors(a).find(v => !/paylocity/i.test(v.name));
  let s1 = bits.length ? `I ${bits.join(' and ')}.` : `I work with HR and finance leaders at companies like ${a.zi && a.zi.name || a.company} on payroll, HR and benefits.`;
  if (tr && bits.length < 2) s1 += tr.kind === 'Acquisition' ? ' With the recent acquisition, I imagine HR and payroll are on the list to sort out.' : ' Saw the recent leadership change, too.';
  const s2 = rn && rn.days <= 180 ? `With your benefits renewing in ${month}, is it worth 15 minutes to see how we'd bring HR, payroll and benefits into one place?`
    : pv ? `Curious how ${pv.name} is working for you. Worth 15 minutes to compare notes?` : 'Worth 15 minutes to compare notes?';
  return `${first ? 'Hi ' + first + ', ' : 'Hi, '}${s1} ${s2}`;
}

function detailParts(a) {
  const p = a.priority, b = p.breakdown;
  const max = { recency: 25, momentum: 15, stage: 20, fit: 15, pages: 15, volume: 5, competitor: 5, known_contact: 2 };
  const label = { recency: 'Recency', momentum: 'Momentum', stage: 'Stage', fit: 'Fit', pages: 'Pages', volume: 'Volume', competitor: 'Competitor', known_contact: 'Known contact' };
  // Display only: shows the points the score already gave, it never changes them.
  const keys = Object.keys(max);
  const frac = k => Math.min(1, (b[k] || 0) / max[k]);
  const level = k => frac(k) >= 1 ? 3 : frac(k) >= 0.5 ? 2 : frac(k) > 0 ? 1 : 0;
  const bars = `<div class="bd-chips">${keys.map(k =>
    `<span class="bd-chip l${level(k)}" title="${label[k]}: ${b[k] || 0} of ${max[k]} points">${label[k]}<b>${b[k] || 0}/${max[k]}</b></span>`).join('')}</div>`;
  const group = test => keys.filter(test).map(k => label[k]).join(', ');
  const full = group(k => frac(k) >= 1), part = group(k => frac(k) > 0 && frac(k) < 1), none = group(k => !frac(k));
  const summary = `<div class="bd-sum">${[full && `<b>Full points:</b> ${full}.`, part && `<b>Partly:</b> ${part}.`, none && `<b>Nothing yet:</b> ${none}.`].filter(Boolean).join(' ')}</div>`;
  // Each section registers itself here; the side panel lays them out by tab (DRAWER_TABS).
  const parts = {};
  const sec = (cls, html) => { if (html && html.trim()) parts[cls] = `<div class="sec ${cls}">${html}</div>`; return ''; };

  // 13-week activity heat strip
  const set = [...a.dates, ...a.activity_dates];
  let cells = '';
  for (let w = 12; w >= 0; w--) {
    const end = addDays(TODAY, -w * 7), start = addDays(end, -6);
    const n = new Set(set.filter(d => d >= start && d <= end)).size;
    cells += `<i class="${n >= 3 ? 'l3' : n === 2 ? 'l2' : n === 1 ? 'l1' : ''}" title="Week ending ${fmtDate(end)}: ${n} active day${n === 1 ? '' : 's'}"></i>`;
  }

  const pages = a.decoded_urls.map(u => {
    const path = pagePath(u.decoded || u.raw);
    const cls = HAND_RAISE_PAGES.some(x => path.includes(x)) ? 'hand' : AD_LANDING_PAGES.some(x => path.includes(x)) ? 'ad' : '';
    const kind = cls === 'hand' ? 'Asked for us (demo, contact, pricing or quote). Strongest buying signal. ' : cls === 'ad' ? 'Came from an ad or campaign page. ' : 'General browsing. ';
    return `<div><span class="d num">${fmtDate(u.date)}</span><a class="${cls}" href="${esc(safeUrl(u.decoded || u.raw))}" target="_blank" rel="noopener" title="${esc(kind + (u.decoded || u.raw))}">${esc(path === '/' ? '(homepage)' : path)}</a></div>`;
  }).join('');

  const kws = [...a.competitor_keywords.map(k => `<span class="kw comp">${esc(k)}</span>`),
    ...a.keywords.filter(k => !a.competitor_keywords.includes(k)).map(k => `<span class="kw">${esc(k)}</span>`)].join('');

  const contacts = a.contacts.map(c => `<div>${esc(c.name || '?')}${c.title ? ' · ' + esc(c.title) : ''}${c.email ? ` · <a href="mailto:${esc(c.email)}" style="color:var(--accent)">${esc(c.email)}</a>` : ''}</div>`).join('');

  void `<tr class="detail"><td colspan="7">
    <div class="detail-grid">
      <div class="dcol">
        ${sec('s-score', `<div class="dblock"><div class="dlabel">Score breakdown · ${p.score}/100</div>${bars}${summary}</div>`)}
        ${sec('s-weeks', `<div class="dblock"><div class="dlabel">Last 13 weeks</div><div class="timeline">${cells}</div>
          <div class="timeline-axis"><span>${fmtDate(addDays(TODAY, -90))}</span><span>today</span></div></div>`)}
        ${sec('s-sig', `<div class="dblock muted">${a.signal_count} signals · ${a.web_visits} web visits · reach ${esc(a.reach || '?')}${a.source_files.length ? ` · ${a.source_files.length} source email${a.source_files.length === 1 ? '' : 's'}` : ''}</div>`)}
      </div>
      <div class="dcol">
        ${sec('s-snap', a.zi && a.zi.firmo ? `<div class="dblock"><div class="dlabel dlabel-logo">${ziLogoLink(a)} Company snapshot</div>
          <dl class="snap">
            <dt>Industry</dt><dd>${esc(a.zi.firmo.industry)}${a.zi.firmo.sub_industry ? ' · ' + esc(a.zi.firmo.sub_industry) : ''}</dd>
            <dt>Employees</dt><dd>${a.zi.firmo.employees ? Number(a.zi.firmo.employees).toLocaleString() : '—'}</dd>
            <dt>Revenue</dt><dd>${esc(a.zi.firmo.revenue_range || '—')}</dd>
            <dt>HQ</dt><dd>${esc(a.zi.firmo.hq || '—')}${a.zi.firmo.locations ? ` · ${a.zi.firmo.locations} location${a.zi.firmo.locations === 1 ? '' : 's'}` : ''}</dd>

            <dt>Careers</dt><dd>${careersHtml(a)}</dd>
            <dt>Payroll / HR</dt><dd>${payrollVendors(a).length ? esc(payrollVendors(a).map(v => v.name + ' (' + v.source + ')').join(', ')) + (a.zi.payroll_tech && a.zi.payroll_tech.evidence ? '<br><span class="muted">' + esc(a.zi.payroll_tech.evidence) + '</span>' : '') : '<span class="muted">Not detected in ZoomInfo. Check Salesforce.</span>'}</dd>
          </dl>
          ${a.zi.firmo.about ? `<div class="about">${esc(a.zi.firmo.about)}</div>` : ''}</div>`
          : `<div class="dblock"><div class="dlabel">Careers</div><div class="careers" style="font-size:12px">${careersHtml(a)}</div></div>`)}
        ${sec('s-bf', benefitsHtml(a))}
        ${sec('s-pages', `<div class="dblock"><div class="dlabel">Pages visited (${a.decoded_urls.length})</div>
          ${pages ? `<div class="pages">${pages}</div>
          <div class="page-key"><span><i style="background:var(--a)"></i><b style="color:var(--a)">Red</b> = asked for us: demo, contact, pricing or quote page</span><span><i style="background:var(--b)"></i><b style="color:var(--b)">Gold</b> = came from an ad or campaign page</span><span><i style="background:var(--accent)"></i><b style="color:var(--accent)">Teal</b> = general browsing (homepage, product, resources)</span></div>` : '<div class="muted">No Paylocity page visits recorded.</div>'}</div>`)}
        ${sec('s-kw', `<div class="dblock"><div class="dlabel">Intent keywords</div>${kws || '<span class="muted">None</span>'}</div>`)}
        ${sec('s-who', whoToCallHtml(a))}
        ${sec('s-trig', triggers(a).length ? `<div class="dblock"><div class="dlabel">Trigger events${a.zi && a.zi.triggers_on ? ' · ZoomInfo checked ' + fmtDate(a.zi.triggers_on) : ''}${a.bf && a.bf.pulled_on && !a.bf.no_match ? ' · BenefitFlow ' + fmtDate(a.bf.pulled_on) : ''}</div>
          ${triggers(a).map(t => `<div class="trig-row"><span class="d num">${t.date ? fmtDate(t.date) : (t.kind === 'New leader' ? 'recent' : '')}</span><span><span class="k">${esc(t.kind)}</span> · ${t.kind === 'New leader' ? leaderHtml(t) : esc(t.text)}${t.link && /^https?:/i.test(t.link) ? ` <a href="${esc(t.link)}" target="_blank" rel="noopener">source ↗</a>` : ''}</span></div>`).join('')}
          ${((a.zi && a.zi.new_leaders) || []).some(p => leaderGroup(p.title)) ? '<div class="muted" style="margin-top:4px">Names and titles from ZoomInfo. Click a name to search LinkedIn for that person at this company. The right person is usually the first result. Look up phone and email in ZoomInfo before calling.</div>' : ''}</div>` : '')}
        ${sec('s-news', newsItems(a).length ? `<div class="dblock"><div class="dlabel">Recent news · last 12 months</div>
          ${newsItems(a).slice(0, 4).map(n => `<div class="news-row"><span class="d num">${fmtDate(n.date)}</span><span><a href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener">${esc(n.title)}</a> <span class="src">${esc(String(n.source || '').replace(/^www\./, ''))}</span></span></div>`).join('')}</div>` : '')}

          ${!a.zi ? '<div class="muted">Not pulled yet.</div>' : `

          ${a.zi.note ? `<div style="font-size:12px;color:var(--yellow);margin-bottom:4px">${esc(a.zi.note)}</div>` : ''}

  </td></tr>`;

function loadedFiles() { return new Set(allAccounts().flatMap(a => a.source_files)); }
function stagedFiles() { return new Set(staged.flatMap(s => s.files || [])); }

async function handleFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  const known = loadedFiles();
  for (const f of files) {
    try {
      if (/\.json$/i.test(f.name)) {
        const data = JSON.parse(await f.text());
        const n = Object.values(data).filter(v => v && v.company).length;
        if (!n) { log('warn', `~ ${esc(f.name)}: no accounts found`); continue; }
        staged.push({ name: f.name, mode: 'snapshot', data, files: [] });
        log('ok', `✓ ${esc(f.name)}: ${n} accounts (JSON, safe to re-load)`);
        continue;
      }
      // Outlook saves every alert under the same name ("<Name>'s 6sense Hot Accounts_ Email Alerts.msg"),
      // so the file name alone can't tell emails apart. Each email is keyed by name + activity date,
      // and it only counts as a duplicate when every account in it already has that day's activity.
      const text = /\.msg$/i.test(f.name) ? msgToText(await f.arrayBuffer()) : await f.text();
      const parsed = parseSixsenseText(text, f.name);
      const fileKey = parsed.activityDate ? `${f.name} (${parsed.activityDate})` : f.name;
      if (known.has(fileKey) || stagedFiles().has(fileKey)) { log('warn', `⚠ ${esc(f.name)}: this email${parsed.activityDate ? ` (activity ${fmtDate(parsed.activityDate)})` : ''} is already loaded, skipped`); continue; }
      if (!parsed.accounts.length) { log('warn', `~ ${esc(f.name)}: no 6sense accounts found${parsed.activityDate ? '' : ' (no "Activities on" date)'}`); continue; }
      parsed.accounts.forEach(a => { a.source_files = [fileKey]; });
      const hasDay = a => {
        const ex = findExisting({ company: a.company, aliases: [], website: a.website });
        const inStage = staged.some(s => s.activityDate === parsed.activityDate && s.data[a.company]);
        return inStage || !!(ex && (ex.activity_dates || []).includes(parsed.activityDate));
      };
      const dupDate = !!parsed.activityDate && parsed.accounts.every(hasDay);
      const data = Object.fromEntries(parsed.accounts.map(a => [a.company, a]));
      const names = parsed.accounts.map(a => a.company);
      if (dupDate) {
        log('warn', `⚠ ${esc(f.name)}: every account in this email already has activity on ${fmtDate(parsed.activityDate)}, so it looks like a duplicate. Skipped. (${names.length} accounts: ${esc(names.slice(0, 4).join(', '))}${names.length > 4 ? '…' : ''})`);
        continue;
      }
      staged.push({ name: f.name, mode: 'increment', data, files: [fileKey], activityDate: parsed.activityDate });
      const isNew = names.filter(n => !findExisting({ company: n, aliases: [], website: data[n].website }));
      log('ok', `✓ ${esc(f.name)}: activity ${fmtDate(parsed.activityDate) || '?'} · ${names.length} accounts (${isNew.length} new): ${esc(names.slice(0, 5).join(', '))}${names.length > 5 ? '…' : ''}`);
    } catch (err) {
      log('err', `✗ ${esc(f.name)}: ${esc(err && err.message ? err.message : String(err))}`);
    }
  }
  document.getElementById('btnApply').classList.toggle('hidden', !staged.length);
  if (staged.length) log('info', `Review the list above, then click ✓ Apply to merge ${staged.length} file${staged.length === 1 ? '' : 's'}.`);
}

async function applyStaged() {
  const applyBtn = document.getElementById('btnApply');
  applyBtn.disabled = true;
  const before = new Map(accounts.map(a => [a.company, a.priority.score]));
  let added = 0, merged = 0;
  const touched = new Set(), hiddenHits = new Set();
  for (const s of staged) {
    const r = ingest(s.data, s.mode); added += r.added; merged += r.merged;
    for (const raw of Object.values(s.data || {})) {
      if (!raw || !raw.company) continue;
      const a = findExisting(clean(raw));
      if (a && !isRemoved(a)) touched.add(a); else if (a) hiddenHits.add(a.company);
    }
  }
  staged = [];
  render();
  const jumped = accounts.filter(a => before.has(a.company) && a.priority.score - before.get(a.company) >= 10).map(a => a.company);
  log('ok', `✓ Applied: ${added} new accounts, ${merged} updated.${jumped.length ? ' Big movers: ' + esc(jumped.slice(0, 5).join(', ')) : ''}`);
  if (hiddenHits.size) log('info', `Kept hidden (you removed ${hiddenHits.size === 1 ? 'it' : 'them'}): ${esc([...hiddenHits].join(', '))}`);

  // Auto ZoomInfo: every account in these emails, whatever its tier (free accounts only, once a day), highest score first
  const fromEmails = [...touched].filter(a => !(a.zi && a.zi.pulled_on === TODAY && !a.zi.skipped)).sort((x, y) => y.priority.score - x.priority.score);
  // plus a catch-up: any other account not pulled in the last 7 days, highest score first (free accounts only)
  const ziCatchUp = accounts.filter(a => !touched.has(a) && ziDue(a)).sort((x, y) => y.priority.score - x.priority.score).slice(0, ZI_MAX_PER_IMPORT);
  const targets = [...fromEmails, ...ziCatchUp];
  if (ziCanRefresh() && targets.length && !ziState.busy) {
    ziState.busy = true;
    log('info', `Checking ZoomInfo for ${fromEmails.length} account${fromEmails.length === 1 ? '' : 's'} from these emails${fromEmails.length ? ': ' + esc(fromEmails.map(a => a.company).slice(0, 6).join(', ')) + (fromEmails.length > 6 ? '…' : '') : ''}${ziCatchUp.length ? `, plus ${ziCatchUp.length} not pulled in the last ${ZI_STALE_DAYS} days` : ''}`);
    setSaveState('', 'ZoomInfo: checking new hot accounts…');
    try {
      const r = await ziRefresh(targets, false);
      r.needCredits.forEach(a => { a.zi.skipped = a.zi.skipped || 'Not pulled: not under management in ZoomInfo, so it would cost credits.'; });
      const withIntent = r.pulled.filter(a => ziRecent(a).length);
      log('ok', `✓ ZoomInfo: ${r.pulled.length} updated${withIntent.length ? ' (' + esc(withIntent.map(a => a.company + ': ' + ziRecent(a).slice(0, 2).map(t => shortTopic(t.topic)).join(', ')).join(' · ')) + ')' : ''}` +
        (r.needCredits.length ? ` · ${r.needCredits.length} skipped (would cost credits; use the account's ZoomInfo button)` : '') +
        (r.noMatch.length ? ` · ${r.noMatch.length} not found in ZoomInfo` : ''));
    } catch (err) {
      log('warn', '⚠ ' + esc(ziErrorText(err)) + ' The email data is still saved.');
    } finally {
      ziState.busy = false;
    }
  } else if (targets.length && !ziCanRefresh() && share.mode === 'writer') {
    log('info', 'ZoomInfo is not available on this page right now, so intent was not refreshed.');
  }
  // Auto BenefitFlow (free searches only): every account in these emails, whatever its tier (once a day), plus a catch-up of every Call today, This week and Heating up account with no BenefitFlow data or data over 30 days old.
  const bfStale = a => !(a.bf && isISO(a.bf.pulled_on)) || daysBetween(TODAY, a.bf.pulled_on) > BF_STALE_DAYS;
  const bfTargets = [...new Set([
    ...[...touched].filter(a => !(a.bf && a.bf.pulled_on === TODAY)).sort((x, y) => y.priority.score - x.priority.score),
    ...accounts.filter(a => ziTarget(a) && bfStale(a)).sort((x, y) => y.priority.score - x.priority.score),
  ])].slice(0, BF_MAX_PER_IMPORT);
  if (bfCanRefresh() && bfTargets.length && !bfState.busy) {
    bfState.busy = true;
    log('info', `Checking BenefitFlow for ${bfTargets.length} account${bfTargets.length === 1 ? '' : 's'} (everything in these emails, plus hot accounts not checked in ${BF_STALE_DAYS} days). About ${Math.ceil(bfTargets.length * 2.6 / 60)} min…`);
    try {
      const r = await bfRefresh(bfTargets);
      const soon = r.pulled.filter(a => bfRenewingSoon(a));
      log('ok', `✓ BenefitFlow: ${r.pulled.length} updated${soon.length ? ' (renewing soon: ' + esc(soon.map(a => a.company + ' ' + fmtDate(bfRenewal(a).date)).join(' · ')) + ')' : ''}${r.noMatch.length ? ` · ${r.noMatch.length} not found` : ''}`);
    } catch (err) {
      log('warn', '⚠ ' + esc(bfErrorText(err)) + ' The email data is still saved.');
    } finally { bfState.busy = false; }
  }
  persist(); render();
  applyBtn.disabled = false;
  applyBtn.classList.add('hidden');
  log('info', 'Saved. Click 💾 Save JSON any time for a backup copy.');
}

// ── .msg (Outlook / OLE compound file) → plain-text body ──
function msgToText(buf) {
  try {
    const body = readMsgBody(buf);
    if (body && body.length > 50) return body;
  } catch (e) { /* fall back below */ }
  // Fallback: brute-force decode. UTF-16LE holds the body; latin1 catches URLs.
  const u16 = new TextDecoder('utf-16le').decode(buf);
  const l1 = new TextDecoder('latin1').decode(buf);
  const marker = s => (s.match(/Salesforce users only/g) || []).length;
  return marker(u16) >= marker(l1) ? u16 : l1;
}

function readMsgBody(buf) {
  const dv = new DataView(buf);
  const u8 = new Uint8Array(buf);
  if (dv.getUint32(0, true) !== 0xE011CFD0) throw new Error('not an Outlook .msg file');
  const ss = 1 << dv.getUint16(0x1E, true), mss = 1 << dv.getUint16(0x20, true);
  const cutoff = dv.getUint32(0x38, true);
  const off = sid => (sid + 1) * ss;
  const END = 0xFFFFFFFE;
  // FAT sector list from the DIFAT
  const fatSectors = [];
  for (let i = 0; i < 109; i++) { const s = dv.getUint32(0x4C + i * 4, true); if (s < 0xFFFFFFFA) fatSectors.push(s); }
  let difat = dv.getUint32(0x44, true), guard = 0;
  while (difat < 0xFFFFFFFA && guard++ < 10000) {
    for (let i = 0; i < ss / 4 - 1; i++) { const s = dv.getUint32(off(difat) + i * 4, true); if (s < 0xFFFFFFFA) fatSectors.push(s); }
    difat = dv.getUint32(off(difat) + ss - 4, true);
  }
  const fat = [];
  fatSectors.forEach(s => { for (let i = 0; i < ss / 4; i++) fat.push(dv.getUint32(off(s) + i * 4, true)); });
  const chain = (start, table) => { const out = []; let s = start, g = 0; while (s < 0xFFFFFFFA && s !== END && g++ < 1e6) { out.push(s); s = table[s]; } return out; };
  const readChain = start => { const sids = chain(start, fat); const out = new Uint8Array(sids.length * ss); sids.forEach((s, i) => out.set(u8.subarray(off(s), off(s) + ss), i * ss)); return out; };
  // Directory
  const dir = readChain(dv.getUint32(0x30, true));
  const ddv = new DataView(dir.buffer);
  const entries = [];
  for (let p = 0; p + 128 <= dir.length; p += 128) {
    const nlen = ddv.getUint16(p + 0x40, true);
    const name = new TextDecoder('utf-16le').decode(dir.subarray(p, p + Math.max(0, nlen - 2)));
    entries.push({ name, type: dir[p + 0x42], left: ddv.getUint32(p + 0x44, true), right: ddv.getUint32(p + 0x48, true),
      child: ddv.getUint32(p + 0x4C, true), start: ddv.getUint32(p + 0x74, true), size: ddv.getUint32(p + 0x78, true) });
  }
  const root = entries[0];
  // children of root (top-level message properties)
  const top = [];
  const walk = i => { if (i >= entries.length || i >= 0xFFFFFFFA) return; const e = entries[i]; top.push(e); walk(e.left); walk(e.right); };
  walk(root.child);
  const miniFat = [];
  { const mf = readChain(dv.getUint32(0x3C, true)); const mdv = new DataView(mf.buffer); for (let i = 0; i + 4 <= mf.length; i += 4) miniFat.push(mdv.getUint32(i, true)); }
  let miniStream = null;
  const readStream = e => {
    if (e.size < cutoff) {
      if (!miniStream) miniStream = readChain(root.start);
      const sids = chain(e.start, miniFat);
      const out = new Uint8Array(sids.length * mss);
      sids.forEach((s, i) => out.set(miniStream.subarray(s * mss, s * mss + mss), i * mss));
      return out.subarray(0, e.size);
    }
    return readChain(e.start).subarray(0, e.size);
  };
  const find = n => top.find(e => e.name.toLowerCase() === n.toLowerCase());
  let e;
  if ((e = find('__substg1.0_1000001F'))) return new TextDecoder('utf-16le').decode(readStream(e));
  if ((e = find('__substg1.0_1000001E'))) return new TextDecoder('windows-1252').decode(readStream(e));
  if ((e = find('__substg1.0_10130102'))) return htmlToText(new TextDecoder('utf-8').decode(readStream(e)));
  return '';
}

function htmlToText(html) {
  const doc = new DOMParser().parseFromString(html.replace(/<(br|\/p|\/div|\/tr|\/li|\/h\d)[^>]*>/gi, '$&\n'), 'text/html');
  return doc.body ? doc.body.textContent : html;
}

const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12 };
function toISODate(s) {
  const m = String(s || '').match(/([A-Za-z]+)\.?\s+(\d{1,2}),?\s*(\d{4})/);
  const mo = m && MONTHS[m[1].slice(0, 3).toLowerCase()];
  if (!mo) return null;
  return `${m[3]}-${String(mo).padStart(2, '0')}-${String(+m[2]).padStart(2, '0')}`;
}

// 6sense "Hot Accounts: Email Alerts" body → accounts
function parseSixsenseText(raw, fileName) {
  const text = String(raw || '').replace(/\r\n?/g, '\n').replace(/ /g, ' ').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  const am = text.match(/Activities on\s*[:\-]?\s*([A-Za-z]+\.?\s+\d{1,2},?\s*\d{4})/i);
  const activityDate = am ? toISODate(am[1]) : null;
  const MARK = 'Salesforce users only';
  const i1 = text.indexOf(MARK), i2 = i1 >= 0 ? text.indexOf(MARK, i1 + MARK.length) : -1;
  const body = text.slice(i2 >= 0 ? i2 + MARK.length : i1 >= 0 ? i1 + MARK.length : 0);
  const DOMAIN_RE = /^([\w][\w.\-]*\.[a-zA-Z]{2,6})\s*(<https?:|$)/;
  const FOOTER_RE = /unsubscribe|manage (your )?(alert|notification)s?|privacy policy|©|all rights reserved/i;
  const looksLikeCompany = s => s.length >= 2 && s.length <= 100 && !/https?:|\t|web visits?\b|known contact|keywords? -|buying stage|profile fit|account reach|recent (web|intent)/i.test(s) && !/\(\d+\)\s*$/.test(s);

  const accounts = [];
  let cur = null, stop = false;
  const date = activityDate || TODAY;
  const consume = line => {
    if (!cur) return;
    let m;
    if ((m = line.match(/Buying Stage:\s*([A-Za-z]+)/i))) cur.stage = cap(m[1]);
    if ((m = line.match(/Profile Fit:\s*([A-Za-z]+)/i))) cur.fit = cap(m[1]);
    if ((m = line.match(/Account Reach:\s*([A-Za-z]+)/i))) cur.reach = cap(m[1]);
    if ((m = line.match(/^(\d+)\s+Web Visits?\b/i)) && !cur._visits) { cur._visits = true; cur.web_visits += +m[1]; cur.signal_count += +m[1]; }
    if ((m = line.match(/(\d+)\s+Keywords?\s*-\s*(\d+)\s+times?\s+researched/i)) && !cur._kwcount) { cur._kwcount = true; cur.signal_count += +m[2]; }
    if ((m = line.match(/\d+\s+Bombora Company Surge Topics?:\s*(.+)$/i))) {
      m[1].split(/\s*[,;]\s*/).map(t => t.trim()).filter(Boolean).forEach(topic => cur.surge_topics.push({ topic, date }));
      return;
    }
    if ((m = line.match(/^(https?:\/\/[^\s<>]+)/i)) && /paylocity\.com/i.test(m[1])) {
      const url = m[1].replace(/[),.;]+$/, '');
      cur.decoded_urls.push({ decoded: url, raw: url, date });
    }
    if (/\(\d+\)/.test(line) && !/https?:/i.test(line)) {
      line.split(/\t+|\s{2,}/).forEach(seg => {
        const k = seg.trim().match(/^(.+?)\s*\((\d+)\)$/);
        if (k && !/^\d/.test(k[1]) && k[1].length < 60) cur.keywords.push(k[1].trim());
      });
    }
  };
  for (const block of body.split(/\n[ \t]*\n/)) {
    if (stop) break;
    const lines = block.split('\n').map(s => s.trim()).filter(Boolean);
    if (!lines.length) continue;
    let start = 0;
    const dm = lines.length >= 2 && looksLikeCompany(lines[0]) ? lines[1].match(DOMAIN_RE) : null;
    if (dm) {
      cur = { company: lines[0], website: 'https://' + dm[1].toLowerCase().replace(/^www\./, ''), stage: '', fit: '', reach: '',
        signal_count: 0, web_visits: 0, keywords: [], competitor_keywords: [], decoded_urls: [], contacts: [], form_fills: [], surge_topics: [],
        dates: activityDate ? [activityDate] : [], activity_dates: activityDate ? [activityDate] : [],
        email_date: activityDate, activity_date: activityDate, _latest_date: activityDate, source_files: [fileName] };
      accounts.push(cur);
      start = 2;
    }
    for (const line of lines.slice(start)) {
      if (FOOTER_RE.test(line)) { stop = true; break; }
      consume(line);
    }
  }
  accounts.forEach(a => { delete a._visits; delete a._kwcount; a.keywords = uniqSorted(a.keywords); });
  return { activityDate, accounts };
}
function cap(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); }

// ═══════════════════════════════════════════════════════════════════════════
// Sharing: when opened as a claude.ai page, the page itself is the shared copy.
// Editors' changes (Worked, notes, imports) republish it, and everyone with
// the link sees the update. Viewers get a read-only mirror.
// ═══════════════════════════════════════════════════════════════════════════
const share = { mode: 'local', artifact: null, downloads: null, timer: null };
function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60); }

const SESSION_UI_KEY = 'sixsense_ui_session';
function saveSessionUi() {
  try {
    sessionStorage.setItem(SESSION_UI_KEY, JSON.stringify({ q: ui.q, tiers: [...ui.tiers], signals: [...ui.signals], stage: ui.stage, fit: ui.fit, active: ui.active,
      hideWorked: ui.hideWorked, sort: ui.sort, dir: ui.dir, open: [...ui.open], y: window.scrollY,
      view: ui.view, drawer: ui.drawer, dtab: ui.dtab, filtersOpen: ui.filtersOpen }));
  } catch (e) { /* ignore */ }
}
function restoreSessionUi() {
  try {
    const s = JSON.parse(sessionStorage.getItem(SESSION_UI_KEY) || 'null');
    if (!s) return;
    sessionStorage.removeItem(SESSION_UI_KEY);
    Object.assign(ui, { q: s.q || '', stage: s.stage || '', fit: s.fit || '', active: s.active || '', hideWorked: s.hideWorked !== false,
      sort: s.sort || 'score', dir: s.dir || -1, view: VIEWS[s.view] ? s.view : ui.view, drawer: s.drawer || null,
      dtab: DRAWER_TABS[s.dtab] ? s.dtab : 'prep', filtersOpen: !!s.filtersOpen });
    ui.tiers = new Set(s.tiers || []); ui.open = new Set(s.open || []);
    ui.signals = new Set((s.signals || (s.card ? [s.card] : [])).filter(k => CARDS[k] && !CARDS[k].tier));
    document.getElementById('q').value = ui.q;
    document.getElementById('fStage').value = ui.stage;
    document.getElementById('fFit').value = ui.fit;
    document.getElementById('fActive').value = ui.active;
    if (s.y) setTimeout(() => window.scrollTo(0, s.y), 0);
  } catch (e) { /* ignore */ }
}

async function initShare() {
  const use = n => window.claude.use(n).catch(() => null);
  const [art, dl, user] = await Promise.all([use('artifact'), use('downloads'), use('user')]);
  share.downloads = dl;
  if (!art || !PAGE_SRC) return;            // not running as a shared page: stay local
  share.artifact = art;
  let canEdit = false;
  try { canEdit = user ? await user.canEdit() : false; } catch (e) { canEdit = false; }
  setShareMode(canEdit ? 'writer' : 'reader');
  initZi();
  initBf();
}

function setShareMode(mode) {
  share.mode = mode;
  const badge = document.getElementById('shareBadge');
  badge.classList.remove('hidden');
  badge.classList.toggle('ro', mode === 'reader');
  badge.textContent = mode === 'writer' ? 'Shared · your changes update everyone' : 'Shared view · read only';
  badge.title = mode === 'writer'
    ? 'Worked marks, notes and imported emails are saved to this page for everyone who has the link.'
    : 'This is a live copy of the owner\'s dashboard. It updates when they make changes.';
  for (const id of ['btnImport', 'btnSave']) document.getElementById(id).classList.toggle('hidden', mode === 'reader');
  document.getElementById('ownerMenu').classList.toggle('hidden', mode === 'reader');
  if (mode === 'reader') document.getElementById('importPanel').classList.add('hidden');
  setSaveState(mode === 'writer' ? 'ok' : '', mode === 'writer' ? 'Up to date' : '');
  render();
}

function buildDocument() {
  const head = document.head.querySelector('style');
  const reset = head ? head.textContent : '';
  const swap = (src, key, value) => {
    const i = src.indexOf(key);
    if (i < 0) throw new Error('page source is missing ' + key);
    const j = key.startsWith('const EMBEDDED_DATA') ? src.indexOf(';\n', i) : src.indexOf(';', i);
    return src.slice(0, i + key.length) + value + src.slice(j);
  };
  let src = PAGE_SRC;
  src = swap(src, 'const EMBEDDED_DATA = ', JSON.stringify(toObject()).replace(/</g, '\\u003c'));
  src = swap(src, 'const PUBLISHED_AT = ', JSON.stringify(new Date().toISOString()));
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' +
    reset + '</style></head><body>' + src + '</body></html>';
}

function schedulePublish(delay) {
  clearTimeout(share.timer);
  setSaveState('', 'Sharing changes…');
  share.timer = setTimeout(publishNow, delay);
}

async function publishNow() {
  if (share.mode !== 'writer' || !share.artifact) return;
  let doc;
  try { doc = buildDocument(); } catch (e) { setSaveState('err', 'Could not share: ' + e.message); return; }
  saveSessionUi();
  try {
    await share.artifact.publish(doc);      // every open view, this one included, reloads to the new version
    setSaveState('ok', 'Shared');
  } catch (err) {
    const code = err && err.code;
    if (code === 'conflict') setSaveState('', 'Someone else just saved. Reloading…');
    else if (code === 'not_writer' || code === 'not_granted') { setSaveState('err', 'Read-only: changes were not saved'); setShareMode('reader'); }
    else setSaveState('err', 'Could not share changes' + (code ? ' (' + code + ')' : '') + '. Use 💾 Save JSON as a backup.');
  }
}
